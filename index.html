<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salah Quest | Instant Sync v1.2.4</title>
    
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/fetkilic/KazaRehberi/refs/heads/main/logo.jpg">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/fetkilic/KazaRehberi/refs/heads/main/logo.jpg">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --gold: #f3d47a;
            --marine-deep: #002b4e;
            --deep-space: #001220;
            --accent: #00d2ff;
            --success: #10b981;
            --error: #ef4444;
        }

        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--deep-space); color: white; overflow-x: hidden; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at top, var(--marine-deep) 0%, var(--deep-space) 100%);
            display: flex; justify-content: center; min-height: 100vh; padding: 15px; box-sizing: border-box;
        }

        #root { width: 100%; max-width: 450px; position: relative; }

        .glass-card {
            position: relative;
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 30px; padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); margin-bottom: 20px;
        }

        .top-nav { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 15px; }
        .version-tag { font-size: 0.6rem; color: var(--gold); padding: 3px 8px; border-radius: 8px; border: 1px solid rgba(243, 212, 122, 0.2); }
        .refresh-btn { background: none; border: 1px solid var(--glass-border); color: var(--gold); border-radius: 8px; cursor: pointer; padding: 3px 6px; font-size: 10px; transition: 0.3s; }

        .header { text-align: center; margin-bottom: 20px; }
        .app-title { font-family: 'Cinzel', serif; color: var(--gold); letter-spacing: 2px; margin: 0; font-size: 1.5rem; text-shadow: 0 0 10px rgba(243, 212, 122, 0.3); }
        
        .countdown-container { text-align: center; margin-bottom: 20px; background: rgba(0,0,0,0.3); border-radius: 20px; padding: 15px; border: 1px solid rgba(243, 212, 122, 0.15); }
        .countdown-label { font-size: 0.65rem; text-transform: uppercase; opacity: 0.7; letter-spacing: 2px; margin-bottom: 5px; display: block; color: var(--accent); }
        .countdown-timer { font-family: 'Cinzel', serif; font-size: 2.1rem; color: var(--gold); font-weight: 700; letter-spacing: 2px; }

        .stats-bar { display: flex; justify-content: space-around; margin: 15px 0; background: rgba(0,0,0,0.3); border-radius: 15px; padding: 10px; border: 1px solid var(--glass-border); }
        .stat-item { text-align: center; }
        .stat-value { display: block; color: var(--gold); font-weight: 600; font-size: 1.1rem; }
        .stat-label { font-size: 0.6rem; text-transform: uppercase; opacity: 0.7; }

        .prayer-list { display: flex; flex-direction: column; gap: 12px; }
        .prayer-card {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; background: rgba(0, 43, 78, 0.4); border-radius: 18px;
            border: 1px solid var(--glass-border); transition: 0.2s ease; cursor: pointer;
        }
        .prayer-card.completed { border-color: var(--gold); background: rgba(243, 212, 122, 0.15); }
        .prayer-card.locked { opacity: 0.25; border: 1px dashed var(--glass-border); cursor: not-allowed; }
        
        .check-btn { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; }
        .completed .check-btn { background: var(--gold); color: var(--marine-deep); font-weight: bold; }

        .kaza-section { margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--glass-border); }
        .section-title { font-size: 0.9rem; color: var(--gold); margin-bottom: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .kaza-item { 
            background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px 15px; border-radius: 15px; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
        }
        .kaza-done-btn { background: var(--success); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 0.7rem; cursor: pointer; font-weight: 600; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 18, 32, 0.95); display: flex; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(10px); }
        .modal { background: var(--marine-deep); border: 2px solid var(--gold); padding: 35px 25px; border-radius: 30px; text-align: center; max-width: 85%; }
        
        .search-container { position: relative; width: 100%; margin-bottom: 15px; }
        input.search-input { width: 100%; padding: 14px; border-radius: 15px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.1); color: white; outline: none; box-sizing: border-box; font-size: 14px; }
        .dropdown-list { position: absolute; top: 100%; left: 0; right: 0; max-height: 180px; overflow-y: auto; background: var(--marine-deep); border: 1px solid var(--glass-border); border-radius: 10px; z-index: 1000; margin-top: 5px; }
        .dropdown-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .btn-gold { background: var(--gold); color: var(--marine-deep); padding: 14px; border-radius: 15px; font-weight: 600; border: none; width: 100%; cursor: pointer; }
        
        .lvl-container { margin-top: 10px; width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; }
        .lvl-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.5s; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        const APP_VERSION = "1.2.4";
        const STORAGE_KEY = 'salah_quest_v24_instant';
        const PRAYER_MAP = { 'Fajr': 'Sabah', 'Dhuhr': 'Öğle', 'Asr': 'İkindi', 'Maghrib': 'Akşam', 'Isha': 'Yatsı' };
        const PRAYER_ORDER = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
        const COUNTRIES = [{ n: "Hollanda", v: "Netherlands" }, { n: "Türkiye", v: "Turkey" }, { n: "Almanya", v: "Germany" }];

        function App() {
            const [setupStep, setSetupStep] = useState(1);
            const [location, setLocation] = useState({ city: '', country: '', countryName: '' });
            const [isConfigured, setIsConfigured] = useState(false);
            const [prayerTimes, setPrayerTimes] = useState(null);
            const [completed, setCompleted] = useState([]);
            const [kazaList, setKazaList] = useState([]);
            const [stats, setStats] = useState({ xp: 0, streak: 0, level: 1 });
            const [popup, setPopup] = useState(null);
            const [searchQuery, setSearchQuery] = useState("");
            const [showDropdown, setShowDropdown] = useState(false);
            const [cities, setCities] = useState([]);
            const [timeLeft, setTimeLeft] = useState("--:--:--");

            const updateStorage = useCallback((loc, st, comp, kaza, times) => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    location: loc, stats: st,
                    completedToday: { date: new Date().toDateString(), list: comp },
                    kazaList: kaza, cachedTimes: times, cacheDate: new Date().toDateString()
                }));
            }, []);

            // Kaza Denetleme Fonksiyonu (Hızlandırılmış)
            const performKazaCheck = useCallback((currentTimes, currentComp, currentKaza) => {
                if (!currentTimes) return { updatedKaza: currentKaza, changed: false };
                const now = new Date();
                const todayStr = now.toDateString();
                let updatedKaza = [...currentKaza];
                let changed = false;

                PRAYER_ORDER.forEach((key, index) => {
                    const pName = PRAYER_MAP[key];
                    let expiryStr = (key === 'Fajr') ? currentTimes['Sunrise'] : (index < PRAYER_ORDER.length - 1 ? currentTimes[PRAYER_ORDER[index+1]] : "23:59");
                    
                    if (expiryStr) {
                        const [h, m] = expiryStr.split(':');
                        const expiry = new Date(); expiry.setHours(parseInt(h), parseInt(m), 0, 0);
                        const kazaId = `${todayStr} ${pName}`;
                        if (now > expiry && !currentComp.includes(pName) && !updatedKaza.includes(kazaId)) {
                            updatedKaza.push(kazaId); changed = true;
                        }
                    }
                });
                return { updatedKaza, changed };
            }, []);

            const fetchDiyanetTimes = async (city, country) => {
                const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=${country}&method=13`);
                const data = await res.json();
                if (data.data) { setPrayerTimes(data.data.timings); return data.data.timings; }
            };

            // Sayaç ve Eşzamanlı Kaza Kontrolü
            useEffect(() => {
                if (!prayerTimes) return;
                const tick = () => {
                    const now = new Date();
                    const createDate = (tStr, offset = 0) => {
                        const [h, m] = tStr.split(':');
                        const d = new Date(); d.setDate(d.getDate() + offset);
                        d.setHours(parseInt(h), parseInt(m), 0, 0); return d;
                    };
                    const milestones = [
                        createDate(prayerTimes.Sunrise), createDate(prayerTimes.Asr),
                        createDate(prayerTimes.Maghrib), createDate(prayerTimes.Isha),
                        createDate('23:59'), createDate(prayerTimes.Fajr, 1)
                    ];
                    const target = milestones.find(m => m > now);
                    const diff = target - now;
                    const h = Math.floor(diff/3600000).toString().padStart(2,'0');
                    const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
                    const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
                    setTimeLeft(`${h}:${m}:${s}`);

                    // Kritik: Sayaç her saniye akarken kazayı da kontrol et (Gecikme sıfırlandı)
                    const check = performKazaCheck(prayerTimes, completed, kazaList);
                    if (check.changed) {
                        setKazaList(check.updatedKaza);
                        updateStorage(location, stats, completed, check.updatedKaza);
                    }
                };
                const timer = setInterval(tick, 1000); tick();
                return () => clearInterval(timer);
            }, [prayerTimes, completed, kazaList, location, stats, performKazaCheck, updateStorage]);

            useEffect(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    setLocation(data.location);
                    setStats(data.stats || { xp: 0, streak: 0, level: 1 });
                    setKazaList(data.kazaList || []);
                    const today = new Date().toDateString();
                    if (data.cachedTimes && data.cacheDate === today) setPrayerTimes(data.cachedTimes);
                    else fetchDiyanetTimes(data.location.city, data.location.country);
                    setCompleted(data.completedToday?.date === today ? data.completedToday.list : []);
                    setIsConfigured(true);
                }
            }, []);

            const isVakitGirdi = (key) => {
                if (!prayerTimes) return false;
                const [h, m] = prayerTimes[key].split(':');
                const target = new Date(); target.setHours(parseInt(h), parseInt(m), 0, 0);
                return new Date() >= target;
            };

            const togglePrayer = (key) => {
                const pName = PRAYER_MAP[key];
                if (!isVakitGirdi(key) && !completed.includes(pName)) {
                    setPopup({ msg: "Vakit henüz girmedi! ⏳" });
                    setTimeout(() => setPopup(null), 2000); return;
                }
                const now = new Date();
                const todayStr = now.toDateString();
                let newComp = completed.includes(pName) ? completed.filter(i => i !== pName) : [...completed, pName];
                let {xp, level, streak} = stats;

                if (!completed.includes(pName)) {
                    let expiryStr = (key === 'Fajr') ? prayerTimes.Sunrise : (PRAYER_ORDER[PRAYER_ORDER.indexOf(key)+1] || "23:59");
                    const [eh, em] = expiryStr.split(':');
                    const expiry = new Date(); expiry.setHours(parseInt(eh), parseInt(em), 0, 0);
                    let gain = (key === 'Fajr') ? (now > expiry ? 1 : 100) : (now > expiry ? 1 : 50);
                    xp += gain;
                } else { xp = Math.max(0, xp - 50); }
                
                if (xp >= 250) { xp -= 250; level++; }
                const newKaza = kazaList.filter(k => k !== `${todayStr} ${pName}`);
                setStats({xp, level, streak}); setCompleted(newComp); setKazaList(newKaza);
                updateStorage(location, {xp, level, streak}, newComp, newKaza);
            };

            const solveKaza = (idx) => {
                const kazaItem = kazaList[idx];
                const newList = kazaList.filter((_, i) => i !== idx);
                let {xp, level, streak} = stats;
                xp += 1; if(xp >= 250) { xp -= 250; level++; }
                const today = new Date().toDateString();
                let newComp = [...completed];
                if (kazaItem.startsWith(today)) {
                    const name = kazaItem.replace(today + " ", "");
                    if (!newComp.includes(name)) newComp.push(name);
                }
                setStats({xp, level, streak}); setKazaList(newList); setCompleted(newComp);
                updateStorage(location, {xp, level, streak}, newComp, newList);
            };

            // Şehir Arama (Hücresel Veri/Yavaş İnternet Dostu)
            useEffect(() => {
                if (location.country && setupStep === 2) {
                    fetch(`https://countriesnow.space/api/v0.1/countries/cities`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ country: location.country })
                    }).then(res => res.json()).then(res => setCities(res.data || []));
                }
            }, [location.country, setupStep]);

            const filteredItems = useMemo(() => {
                const list = setupStep === 1 ? COUNTRIES.map(c => ({n: c.n, v: c.v})) : cities;
                return list.filter(i => (i.n || i).toLowerCase().includes(searchQuery.toLowerCase())).slice(0, 40);
            }, [searchQuery, setupStep, cities]);

            if (!isConfigured) {
                return (
                    <div className="glass-card" onClick={() => setShowDropdown(false)}>
                        <h1 className="app-title">SALAH QUEST</h1>
                        <div style={{marginTop:'20px'}}>
                            <div className="search-container" onClick={e => e.stopPropagation()}>
                                <input className="search-input" placeholder={setupStep === 1 ? "Ülke Seçin" : "Şehir Seçin"} value={showDropdown ? searchQuery : (setupStep === 1 ? location.countryName : location.city)} 
                                    onChange={e => { setSearchQuery(e.target.value); setShowDropdown(true); }}
                                    onFocus={() => { setSearchQuery(""); setShowDropdown(true); }} />
                                {showDropdown && (
                                    <div className="dropdown-list">
                                        {filteredItems.map(i => (
                                            <div key={i.v || i} className="dropdown-item" onClick={() => { 
                                                if(setupStep === 1) setLocation({...location, country: i.v, countryName: i.n});
                                                else setLocation({...location, city: i});
                                                setSearchQuery(""); setShowDropdown(false);
                                            }}>{i.n || i}</div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <button className="btn-gold" onClick={() => { 
                                if(setupStep === 1 && location.country) setSetupStep(2); 
                                else if(location.city) { setIsConfigured(true); fetchDiyanetTimes(location.city, location.country).then(t => updateStorage(location, stats, [], [], t)); }
                            }}>{setupStep === 1 ? "İLERİ" : "BAŞLA"}</button>
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    {popup && <div className="overlay" onClick={() => setPopup(null)}><div className="modal"><h2>{popup.msg}</h2></div></div>}
                    <div className="glass-card">
                        <div className="top-nav"><span className="version-tag">v{APP_VERSION}</span><button className="refresh-btn" onClick={() => { fetchDiyanetTimes(location.city, location.country); setPopup({msg:"Güncellendi!"}); setTimeout(()=>setPopup(null),1000); }}>↻</button></div>
                        <h1 className="app-title">SALAH QUEST</h1>
                        <div className="lvl-container"><div className="lvl-fill" style={{width: `${(stats.xp / 250) * 100}%`}}></div></div>
                        <div className="countdown-container">
                            <span className="countdown-label">Vaktin çıkmasına kalan</span>
                            <div className="countdown-timer">{timeLeft}</div>
                        </div>
                        <div className="stats-bar">
                            <div className="stat-item"><span className="stat-label">Mertebe</span><span className="stat-value">{stats.level}</span></div>
                            <div className="stat-item"><span className="stat-label">Seri</span><span className="stat-value">{stats.streak} 🔥</span></div>
                            <div className="stat-item"><span className="stat-label">Tecrübe</span><span className="stat-value">{stats.xp}/250</span></div>
                        </div>
                        <div className="prayer-list">
                            {prayerTimes && PRAYER_ORDER.map(key => {
                                const active = isVakitGirdi(key) || completed.includes(PRAYER_MAP[key]);
                                return (
                                    <div key={key} className={`prayer-card ${completed.includes(PRAYER_MAP[key]) ? 'completed' : ''} ${!active ? 'locked' : ''}`} onClick={() => togglePrayer(key)}>
                                        <div><span>{PRAYER_MAP[key]}</span> <small style={{opacity:0.5}}>{prayerTimes[key]}</small></div>
                                        <div className="check-btn">{completed.includes(PRAYER_MAP[key]) ? '✓' : ''}</div>
                                    </div>
                                );
                            })}
                        </div>
                        <div className="kaza-section">
                            <div className="section-title">⏳ Kaza Listesi ({kazaList.length})</div>
                            {kazaList.map((item, idx) => (
                                <div key={idx} className="kaza-item">
                                    <span>{item}</span>
                                    <button className="kaza-done-btn" onClick={() => solveKaza(idx)}>KILINDI</button>
                                </div>
                            ))}
                        </div>
                    </div>
                    <center><button style={{background:'transparent', color:'rgba(255,255,255,0.05)', border:'none', fontSize:'9px'}} onClick={() => {if(confirm("Sıfırlansın mı?")) {localStorage.removeItem(STORAGE_KEY); window.location.reload();}}}>SİSTEMİ SIFIRLA</button></center>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
