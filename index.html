<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salah Quest | Akıllı Kaza Sistemi v1.1.1</title>
    
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/fetkilic/KazaRehberi/refs/heads/main/logo.jpg">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/fetkilic/KazaRehberi/refs/heads/main/logo.jpg">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --gold: #f3d47a;
            --marine-deep: #002b4e;
            --deep-space: #001220;
            --accent: #00d2ff;
            --success: #10b981;
            --error: #ef4444;
        }

        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--deep-space); color: white; overflow-x: hidden; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at top, var(--marine-deep) 0%, var(--deep-space) 100%);
            display: flex; justify-content: center; min-height: 100vh; padding: 15px; box-sizing: border-box;
        }

        #root { width: 100%; max-width: 450px; position: relative; }

        .glass-card {
            position: relative;
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 30px; padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); margin-bottom: 20px;
        }

        .top-nav { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 15px; }
        .version-tag { font-size: 0.6rem; color: var(--gold); padding: 3px 8px; border-radius: 8px; border: 1px solid rgba(243, 212, 122, 0.2); }
        .refresh-btn { background: none; border: 1px solid var(--glass-border); color: var(--gold); border-radius: 8px; cursor: pointer; padding: 3px 6px; font-size: 10px; }

        .header { text-align: center; margin-bottom: 20px; }
        .app-title { font-family: 'Cinzel', serif; color: var(--gold); letter-spacing: 2px; margin: 0; font-size: 1.5rem; text-shadow: 0 0 10px rgba(243, 212, 122, 0.3); }
        
        .stats-bar { display: flex; justify-content: space-around; margin: 15px 0; background: rgba(0,0,0,0.3); border-radius: 15px; padding: 10px; border: 1px solid var(--glass-border); }
        .stat-item { text-align: center; }
        .stat-value { display: block; color: var(--gold); font-weight: 600; font-size: 1.1rem; }
        .stat-label { font-size: 0.6rem; text-transform: uppercase; opacity: 0.7; }

        .prayer-list { display: flex; flex-direction: column; gap: 12px; }
        .prayer-card {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px; background: rgba(0, 43, 78, 0.4); border-radius: 18px;
            border: 1px solid var(--glass-border); transition: 0.3s ease; cursor: pointer;
        }
        .prayer-card.completed { border-color: var(--gold); background: rgba(243, 212, 122, 0.15); }
        .prayer-card.locked { opacity: 0.4; border-style: dashed; }
        
        .check-btn {
            width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--gold);
            display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }
        .completed .check-btn { background: var(--gold); color: var(--marine-deep); font-weight: bold; }

        .kaza-section { margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--glass-border); }
        .section-title { font-size: 0.9rem; color: var(--gold); margin-bottom: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .kaza-item { 
            background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.15);
            padding: 12px 15px; border-radius: 15px; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
        }
        .kaza-done-btn { background: var(--success); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 0.7rem; cursor: pointer; font-weight: 600; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 18, 32, 0.95); display: flex; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(10px); }
        .modal { background: var(--marine-deep); border: 2px solid var(--gold); padding: 35px 25px; border-radius: 30px; text-align: center; max-width: 85%; }
        
        .btn-gold { background: var(--gold); color: var(--marine-deep); padding: 14px; border-radius: 15px; font-weight: 600; border: none; width: 100%; margin-top: 10px; cursor: pointer; }
        
        .lvl-container { margin-top: 10px; width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; }
        .lvl-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.5s; }

        .search-input { width: 100%; padding: 14px; border-radius: 15px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.1); color: white; outline: none; box-sizing: border-box; }
        .dropdown-list { position: absolute; top: 100%; left: 0; right: 0; max-height: 180px; overflow-y: auto; background: var(--marine-deep); border: 1px solid var(--glass-border); border-radius: 10px; z-index: 1000; margin-top: 5px; }
        .dropdown-item { padding: 12px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const APP_VERSION = "1.1.1";
        const STORAGE_KEY = 'salah_quest_v11_smart';
        const PRAYER_MAP = { 'Fajr': 'Sabah', 'Dhuhr': 'Öğle', 'Asr': 'İkindi', 'Maghrib': 'Akşam', 'Isha': 'Yatsı' };
        const PRAYER_ORDER = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];

        const COUNTRIES = [{ n: "Türkiye", v: "Turkey" }, { n: "Hollanda", v: "Netherlands" }, { n: "Almanya", v: "Germany" }];

        function App() {
            const [setupStep, setSetupStep] = useState(1);
            const [location, setLocation] = useState({ city: '', country: '', countryName: '' });
            const [isConfigured, setIsConfigured] = useState(false);
            const [prayerTimes, setPrayerTimes] = useState(null);
            const [completed, setCompleted] = useState([]);
            const [kazaList, setKazaList] = useState([]);
            const [stats, setStats] = useState({ xp: 0, streak: 0, level: 1 });
            const [popup, setPopup] = useState(null);
            const [searchQuery, setSearchQuery] = useState("");
            const [showDropdown, setShowDropdown] = useState(false);
            const [cities, setCities] = useState([]);

            useEffect(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    setLocation(data.location);
                    setStats(data.stats || { xp: 0, streak: 0, level: 1 });
                    setKazaList(data.kazaList || []);
                    setCompleted(data.completedToday?.date === new Date().toDateString() ? data.completedToday.list : []);
                    setIsConfigured(true);
                    fetchDiyanetTimes(data.location.city, data.location.country);
                }
            }, []);

            const updateStorage = (loc, st, comp, kaza) => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    location: loc, stats: st,
                    completedToday: { date: new Date().toDateString(), list: comp },
                    kazaList: kaza
                }));
            };

            const fetchDiyanetTimes = async (city, country) => {
                try {
                    const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=${country}&method=13&school=0`);
                    const data = await res.json();
                    if (data.data) setPrayerTimes(data.data.timings);
                } catch (err) { console.error(err); }
            };

            // DİNAMİK KAZA KONTROLÜ (VAKİT GEÇTİ Mİ?)
            useEffect(() => {
                if (!prayerTimes || !isConfigured) return;

                const checkInterval = setInterval(() => {
                    const now = new Date();
                    const todayStr = now.toDateString();
                    let updatedKaza = [...kazaList];
                    let changed = false;

                    PRAYER_ORDER.forEach((key, index) => {
                        const pName = PRAYER_MAP[key];
                        // Vakit çıkış saatini bul (Sabah için Güneş, diğerleri için bir sonraki vakit)
                        let expiryTimeStr = (key === 'Fajr') ? prayerTimes['Sunrise'] : prayerTimes[PRAYER_ORDER[index + 1]];
                        
                        // Yatsı için gün sonu baz alınır (Ertesi gün sabah imsak)
                        if (key === 'Isha') expiryTimeStr = "23:59"; 

                        if (expiryTimeStr) {
                            const [h, m] = expiryTimeStr.split(':');
                            const expiryDate = new Date();
                            expiryDate.setHours(parseInt(h), parseInt(m), 0, 0);

                            const kazaItemName = `${todayStr} ${pName}`;
                            
                            // Eğer vakit geçtiyse, henüz tamamlanmadıysa VE kaza listesinde yoksa ekle
                            if (now > expiryDate && !completed.includes(pName) && !updatedKaza.includes(kazaItemName)) {
                                updatedKaza.push(kazaItemName);
                                changed = true;
                            }
                        }
                    });

                    if (changed) {
                        setKazaList(updatedKaza);
                        updateStorage(location, stats, completed, updatedKaza);
                    }
                }, 10000); // 10 saniyede bir kontrol et

                return () => clearInterval(checkInterval);
            }, [prayerTimes, completed, kazaList, isConfigured]);

            const isVakitGirdi = (key) => {
                if (!prayerTimes) return false;
                const [h, m] = prayerTimes[key].split(':');
                const target = new Date(); target.setHours(parseInt(h), parseInt(m), 0, 0);
                return new Date() >= target;
            };

            const togglePrayer = (key) => {
                const pName = PRAYER_MAP[key];
                let newComp = [...completed];
                let {xp, level, streak} = stats;
                const todayStr = new Date().toDateString();
                const kazaItemName = `${todayStr} ${pName}`;

                if (!completed.includes(pName) && !isVakitGirdi(key)) {
                    setPopup({ msg: "Vakit henüz girmedi! ⏳" });
                    setTimeout(() => setPopup(null), 2000);
                    return;
                }

                if (completed.includes(pName)) {
                    newComp = newComp.filter(i => i !== pName);
                    xp = Math.max(0, xp - 50);
                } else {
                    newComp.push(pName);
                    xp += 50;
                    // EĞER KAZA LİSTESİNDEYSE OTOMATİK SİL
                    const newKaza = kazaList.filter(k => k !== kazaItemName);
                    setKazaList(newKaza);
                    updateStorage(location, {xp, level, streak}, newComp, newKaza);
                }
                
                if(xp >= 250) { xp = 0; level++; }
                setStats({xp, level, streak}); setCompleted(newComp);
                updateStorage(location, {xp, level, streak}, newComp, kazaList);
            };

            const solveKaza = (idx) => {
                const newList = [...kazaList];
                newList.splice(idx, 1);
                let {xp, level, streak} = stats;
                xp += 1;
                if(xp >= 250) { xp = 0; level++; }
                setKazaList(newList);
                setStats({xp, level, streak});
                updateStorage(location, {xp, level, streak}, completed, newList);
            };

            useEffect(() => {
                if (location.country && setupStep === 2) {
                    fetch(`https://countriesnow.space/api/v0.1/countries/cities`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ country: location.country })
                    }).then(res => res.json()).then(res => setCities(res.data || []));
                }
            }, [location.country, setupStep]);

            const filteredItems = useMemo(() => {
                const list = setupStep === 1 ? COUNTRIES.map(c => ({n: c.n, v: c.v})) : cities;
                return list.filter(i => (i.n || i).toLowerCase().includes(searchQuery.toLowerCase())).slice(0, 40);
            }, [searchQuery, setupStep, cities]);

            if (!isConfigured) {
                return (
                    <div className="glass-card" onClick={() => setShowDropdown(false)}>
                        <div className="header"><h1 className="app-title">SALAH QUEST</h1></div>
                        <div style={{display:'flex', flexDirection:'column', gap:'15px'}}>
                            <div className="search-container" onClick={e => e.stopPropagation()}>
                                <input className="search-input" placeholder={setupStep === 1 ? "Ülke seçin..." : "Şehir seçin..."}
                                    value={showDropdown ? searchQuery : (setupStep === 1 ? location.countryName : location.city)} 
                                    onChange={e => { setSearchQuery(e.target.value); setShowDropdown(true); }}
                                    onFocus={() => { setSearchQuery(""); setShowDropdown(true); }} />
                                {showDropdown && (
                                    <div className="dropdown-list">
                                        {filteredItems.map(i => (
                                            <div key={i.v || i} className="dropdown-item" onClick={() => { 
                                                if(setupStep === 1) setLocation({...location, country: i.v, countryName: i.n});
                                                else setLocation({...location, city: i});
                                                setSearchQuery(""); setShowDropdown(false);
                                            }}>{i.n || i}</div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <button className="btn-gold" onClick={() => { if(setupStep === 1 && location.country) setSetupStep(2); else if(location.city) { setIsConfigured(true); fetchDiyanetTimes(location.city, location.country); } }}>İLERİ</button>
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    {popup && <div className="overlay" onClick={() => setPopup(null)}><div className="modal"><h2>{popup.msg}</h2></div></div>}
                    <div className="glass-card">
                        <div className="top-nav"><span className="version-tag">v{APP_VERSION}</span><button className="refresh-btn" onClick={() => window.location.reload(true)}>↻</button></div>
                        <div className="header"><h1 className="app-title">SALAH QUEST</h1>
                            <div className="lvl-container"><div className="lvl-fill" style={{width: `${(stats.xp / 250) * 100}%`}}></div></div>
                        </div>
                        <div className="stats-bar">
                            <div className="stat-item"><span className="stat-label">Mertebe</span><span className="stat-value">{stats.level}</span></div>
                            <div className="stat-item"><span className="stat-label">Seri</span><span className="stat-value">{stats.streak} 🔥</span></div>
                            <div className="stat-item"><span className="stat-label">Tecrübe</span><span className="stat-value">{stats.xp}/250</span></div>
                        </div>
                        
                        <div className="prayer-list">
                            {prayerTimes ? PRAYER_ORDER.map(key => (
                                <div key={key} className={`prayer-card ${completed.includes(PRAYER_MAP[key]) ? 'completed' : ''} ${!isVakitGirdi(key) && !completed.includes(PRAYER_MAP[key]) ? 'locked' : ''}`} onClick={() => togglePrayer(key)}>
                                    <div className="prayer-info"><span className="prayer-name">{PRAYER_MAP[key]}</span> <small style={{opacity:0.6}}>{prayerTimes[key]}</small></div>
                                    <div className="check-btn">{completed.includes(PRAYER_MAP[key]) ? '✓' : ''}</div>
                                </div>
                            )) : <div>Yükleniyor...</div>}
                        </div>

                        <div className="kaza-section">
                            <div className="section-title">⏳ Kaza Namazları ({kazaList.length})</div>
                            <div className="kaza-list">
                                {kazaList.length > 0 ? kazaList.map((item, idx) => (
                                    <div key={idx} className="kaza-item">
                                        <span>{item}</span>
                                        <button className="kaza-done-btn" onClick={() => solveKaza(idx)}>KILINDI</button>
                                    </div>
                                )) : <div style={{fontSize:'0.7rem', opacity:0.5, textAlign:'center'}}>Kaza borcun yok. Maşallah! ✨</div>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
